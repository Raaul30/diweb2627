<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos estructurales</title>
</head>

<body>

    <!--Podría tener forma rectangular, un color de fondo principal y el título destacado con un tamaño de letra grande.-->
    <header>

        <!--Podría tener un tamaño grande, estar en negrita y utilizar un color que contraste con el fondo. -->
        <h1>Mi página web</h1>

        <!--Podría aparecer en forma de barra horizontal con un color de fondo diferente para distinguirla.-->
        <nav>

            <!--Podrían tener un color diferente y cambiar al pasar el ratón.-->
            <a>Inicio</a> |
            <a>Sobre mí</a> |
            <a>Contacto</a>

        </nav>
    </header>

    <!--Podría ocupar la mayor parte de la pantalla y estar centrado.-->
    <main>

        <!--Podría tener un fondo diferente para separarla del resto del contenido.-->
        <section id="inicio">

            <!--Podría tener un tamaño grande para destacar más que el párrafo.-->
            <h2>Bienvenido</h2>

            <!--Podría utilizar un tamaño de letra cómodo y un color buenos para ser legible.-->
            <p>Ejemplo para section.</p>

        </section>

        <!--Podría tener un fondo o borde diferente para distinguirla.-->
        <section id="sobre-mi">

            <h2>Sobre mí</h2>

            <!--Podría mostrarse como una tarjeta con un fondo diferennte.-->
            <article>

                <!--Podría tener un tamaño menor que el H2 pero destacar más que el texto.-->
                <h3>Artículo</h3>

                <!--Podría utilizar un texto sencillo y fácil de leer.-->
                <p>Ejemplo de artículo.</p>

            </article>

            <!--Podría utilizar el mismo diseño que el artículo anterior para mantener el estilo.-->
            <article>

                <h3>Artículo 2</h3>

                <p>Ejemplo de artículo 2.</p>

            </article>

        </section>

        <!--Podría tener un color de fondo diferente o un borde para diferenciarlo.-->
        <aside>

            <h3>Aside</h3>

            <p>Ejemplo aside.</p>

        </aside>

    </main>

    <!--Podría tener un fondo de otro color y el texto en contraste para diferenciarlo del resto.-->
    <footer id="contacto">
        <p>Footer</p>

        <p>Relleno del footer</p>

    </footer>

</body>
</html>
