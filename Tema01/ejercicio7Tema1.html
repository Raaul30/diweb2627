<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos estructurales</title>
</head>
<body>

    <header>
        <h1>Mi página web</h1>

        <nav>
            <a>Inicio</a> |
            <a>Sobre mí</a> |
            <a>Contacto</a>
        </nav>
    </header>

    <main>

        <section id="inicio">
            <h2>Bienvenido</h2>
            <p>Ejemplo para section.</p>
        </section>

        <section id="sobre-mi">
            <h2>Sobre mí</h2>

            <article>
                <h3>Artículo</h3>
                <p>Ejemplo de artículo.</p>
            </article>

            <article>
                <h3>Artículo 2</h3>
                <p>Ejemplo de artículo 2.</p>
            </article>
        </section>

        <aside>
            <h3>Aside</h3>
            <p>Ejemplo aside.</p>
        </aside>

    </main>

    <footer id="contacto">
        <p>Footer</p>
        <p>Relleno del footer</p>
    </footer>

</body>
</html>
